on:
  workflow_call:
    inputs:
      python-versions:
        description: >-
          Version range or exact version of Python to use, using SemVer's version range syntax.
        required: true
        type: string
      extra-args:
        description: >-
          Extra arguments to pass to tox.
        required: false
        type: string
        default: ''
      working-directory:
        description: >-
          The working directory to run tox in.
        required: false
        type: string
        default: ${{ github.workspace }}

jobs:
  tox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.13'

      - name: Checkout requirements repo
        uses: actions/checkout@v5
        with:
          repository: coatl-dev/workflow-requirements
          path: deps

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}-${{ hashFiles('deps/requirements/tox.txt') }}

      - name: Install requirements
        run: |
          python -m pip install --requirement deps/requirements/tox.txt

      - name: Set up tox caching
        id: setup-tox
        run: |
          if [[ "${{ inputs.working-directory }}" != "${{ github.workspace }}" ]]; then
            echo "tox-cache-dir=${{ inputs.working-directory }}/.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=${{ inputs.working-directory }}/tox.ini" >> $GITHUB_OUTPUT
          else
            echo "tox-cache-dir=.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=tox.ini" >> $GITHUB_OUTPUT
          fi

      - name: Cache tox
        id: cache-tox
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-tox.outputs.tox-cache-dir }}
          key: tox-${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}-${{ hashFiles(steps.setup-tox.outputs.tox-ini) }}

      - name: Set up Python versions for tox
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-versions }}

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          tox ${{ inputs.extra-args }}
