on:
  workflow_call:
    inputs:
      checkout-ref:
        description: >-
          The branch, tag or SHA to checkout.
        required: false
        type: string
      python-versions:
        description: A list of Python versions.
        required: true
        type: string
      working-directory:
        description: >-
          The working directory to run tox in.
        required: false
        type: string
        default: ${{ github.workspace }}

jobs:
  tox:
    name: tox-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python
        id: cache-python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-python.outputs.python-path }}
          key: py-${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade tox-gh

      - name: Set up tox caching
        id: setup-tox
        run: |
          if [[ "${INPUTS_WORKING_DIRECTORY}" != "${{ github.workspace }}" ]]; then
            echo "tox-cache-dir=${INPUTS_WORKING_DIRECTORY}/.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=${INPUTS_WORKING_DIRECTORY}/tox.ini" >> $GITHUB_OUTPUT
          else
            echo "tox-cache-dir=.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=tox.ini" >> $GITHUB_OUTPUT
          fi
        env:
          INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}

      - name: Cache tox
        id: cache-tox
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-tox.outputs.tox-cache-dir }}
          key: tox-gh-${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}-${{ hashFiles(steps.setup-tox.outputs.tox-ini) }}

      - name: Run tox
        working-directory: ${{ inputs.working-directory }}
        run: |
          tox
