on:
  workflow_call:
    inputs:
      checkout-ref:
        description: >-
          The branch, tag or SHA to checkout.
        required: false
        type: string
      python-versions:
        description: A list of Python versions.
        required: true
        type: string
      working-directory:
        description: >-
          The working directory to run tox in.
        required: false
        type: string
        default: ${{ github.workspace }}

jobs:
  tox:
    name: tox-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python
        id: cache-python
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup-python.outputs.python-path }}
          key: py-${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade tox-gh

      - name: Set up tox caching
        id: setup-tox
        run: |
          if [[ "${{ inputs.working-directory }}" != "${{ github.workspace }}" ]]; then
            echo "tox-cache-dir=${{ inputs.working-directory }}/.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=${{ inputs.working-directory }}/tox.ini" >> $GITHUB_OUTPUT
          else
            echo "tox-cache-dir=.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=tox.ini" >> $GITHUB_OUTPUT
          fi

      - name: Cache tox
        id: cache-tox
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup-tox.outputs.tox-cache-dir }}
          key: tox-gh-${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}-${{ hashFiles(steps.setup-tox.outputs.tox-ini) }}

      - name: Run tox
        working-directory: ${{ inputs.working-directory }}
        run: |
          tox
