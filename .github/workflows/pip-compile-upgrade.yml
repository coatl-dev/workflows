on:
  workflow_call:
    inputs:
      checkout-ref:
        description: >-
          The branch, tag or SHA to checkout.
        required: false
        type: string
      path:
        description: >-
          The location of the requirement file(s).
        required: true
        type: string
      extra-args:
        description: >-
          Extra arguments to pass to pip-compile.
        required: false
        type: string
        default: ''
      working-directory:
        description: >-
          The directory to run the workflow in.
        required: false
        type: string
        default: ${{ github.workspace }}
      pr-create:
        description: >-
          Whether to create a Pull Request.
        required: false
        type: string
        default: 'yes'
      pr-commit-message:
        description: >-
          Use the given <msg> as the commit message.
        required: false
        type: string
        default: 'chore(requirements): pip-compile upgrade'
      pr-auto-merge:
        description: >-
          Automatically merge only after necessary requirements are met.
        required: false
        type: string
        default: 'yes'
      pr-delete-branch:
        description: >-
          Delete the local and remote branch after merge.
        required: false
        type: string
        default: 'no'
      sign-commits:
        required: false
        type: string
        default: 'yes'
    secrets:
      gh-token:
        description: >-
          GitHub token.
        required: false
      gpg-sign-passphrase:
        description: >-
          GPG private key passphrase.
        required: false
      gpg-sign-private-key:
        description: >-
          GPG private key exported as an ASCII armored version.
        required: false

jobs:
  pip-compile-upgrade:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coatl-dev/python-tools:2.7-pip-tools
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Upgrade requirements
        id: pip-compile-upgrade
        env:
          INPUT_PATH: ${{ inputs.path }}
          INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          function process_file() {
            local file="$1"
            local extra_args="${INPUT_EXTRA_ARGS:-}"

            command=$(grep -m 1 "#    pip-compile" "$file")
            if [ -n "$command" ]; then
              upgrade_command=$(grep -m 1 "#    pip-compile" "$file" | sed "s/#    pip-compile/pip-compile --upgrade $extra_args/")
              eval "$upgrade_command"
            else
              exit 1
            fi
          }

          if [ -d "${INPUT_PATH}" ]; then
            cd "${INPUT_PATH}" || exit
            for file in *.txt; do
              if [ -f "$file" ]; then
                process_file "$file"
              fi
            done
          elif [ -f "${INPUT_PATH}" ]; then
            process_file "${INPUT_PATH}"
          else
            exit 1
          fi

      - name: Detect changes
        id: git-diff
        uses: coatl-dev/actions/simple-git-diff@v5
        with:
          path: ${{ inputs.path }}

      - name: Import GPG key
        if: ${{ steps.git-diff.outputs.diff == 'true' && inputs.pr-create == 'yes' && inputs.sign-commits == 'yes' }}
        id: gpg-import
        uses: coatl-dev/actions/gpg-import@v5
        with:
          passphrase: ${{ secrets.gpg-sign-passphrase }}
          private-key: ${{ secrets.gpg-sign-private-key }}

      - name: Build commit message
        if: ${{ steps.git-diff.outputs.diff == 'true' }}
        run: |
          echo "${{ inputs.pr-commit-message }}" > "$RUNNER_TEMP/commit.txt"
          {
              echo ""
              echo "updates:"
              git status --porcelain | awk 'match($1, "M") {print "  - " $2}'
          } >> "$RUNNER_TEMP/commit.txt"

      - name: Commit and push changes
        if: ${{ steps.git-diff.outputs.diff == 'true' && inputs.pr-create == 'yes' }}
        run: |
          git checkout -B coatl-dev-pip-compile-upgrade
          git add ${{ inputs.path }}
          git commit --file="${RUNNER_TEMP}/commit.txt"
          git push --force --set-upstream origin coatl-dev-pip-compile-upgrade

      - name: Create pull request
        if: ${{ steps.git-diff.outputs.diff == 'true' && inputs.pr-create == 'yes' }}
        uses: coatl-dev/actions/pr-create@v5
        with:
          gh-token: ${{ secrets.gh-token }}
          auto-merge: ${{ inputs.pr-auto-merge }}
          delete-branch: ${{ inputs.pr-delete-branch }}
