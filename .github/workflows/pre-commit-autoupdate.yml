on:
  workflow_call:
    inputs:
      autoupdate-branch:
        description: >-
          The branch to use for autoupdate.
        type: string
        required: false
        default: ''
      checkout-ref:
        description: >-
          The branch, tag or SHA to checkout.
        required: false
        type: string
      pr-auto-merge:
        description: >-
          Automatically merge only after necessary requirements are met.
        required: false
        type: string
        default: 'yes'
      pr-branch:
        description: >-
          The branch to use for autoupdate.
        type: string
        required: false
        default: 'coatl-dev-pre-commit-autoupdate'
      pr-delete-branch:
        description: >-
          Delete the local and remote branch after merge.
        required: false
        type: string
        default: 'no'
      sign-commits:
        required: false
        type: string
        default: 'yes'
      skip-repos:
        description: >-
          A list of repos to exclude from autoupdate.
        type: string
        required: false
    secrets:
      gh-token:
        description: >-
          GitHub token.
        required: false
      gpg-sign-passphrase:
        description: >-
          GPG private key passphrase.
        required: false
      gpg-sign-private-key:
        description: >-
          GPG private key exported as an ASCII armored version.
        required: false


jobs:
  pre-commit-autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: setup-python
        with:
          python-version: '3.14'

      - name: Checkout requirements repo
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          repository: coatl-dev/workflow-requirements
          path: deps

      - name: Cache pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: pip-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('deps/requirements/pre-commit.txt') }}

      - name: Install pre-commit
        run: |
          python -m pip install --requirement deps/requirements/pre-commit.txt

      - name: Update repos
        run: |
          if [ -z "$INPUT_SKIP_REPOS" ]; then
              while IFS='' read -r repo || [ -n "${repo}" ]; do
                  pre-commit autoupdate --repo "$repo"
              done < <(
                  grep -Eo 'https://[a-zA-Z0-9./?=_%:-]*' .pre-commit-config.yaml
              )
          else
              while IFS='' read -r repo || [ -n "${repo}" ]; do
                  pre-commit autoupdate --repo "$repo"
              done < <(
                  grep -Eo 'https://[a-zA-Z0-9./?=_%:-]*' .pre-commit-config.yaml |
                  grep -iEwv "$INPUT_SKIP_REPOS"
              )
          fi
        env:
          INPUT_SKIP_REPOS: ${{ inputs.skip-repos }}

      - name: Detect changes
        id: git-diff
        uses: coatl-dev/actions/simple-git-diff@208567f6e604baf94c6e867ec7f345ec9ad36eb4 # v7.0.0
        with:
          path: .pre-commit-config.yaml

      - name: Import GPG key
        if: ${{ steps.git-diff.outputs.diff == 'true' && inputs.sign-commits == 'yes' }}
        id: gpg-import
        uses: coatl-dev/actions/gpg-import@208567f6e604baf94c6e867ec7f345ec9ad36eb4 # v7.0.0
        with:
          passphrase: ${{ secrets.gpg-sign-passphrase }}
          private-key: ${{ secrets.gpg-sign-private-key }}

      - name: Build commit message
        if: ${{ steps.git-diff.outputs.diff == 'true' }}
        run: |
          echo "build(deps): coatl-dev pre-commit autoupdate" > "$RUNNER_TEMP/commit.txt"
          {
              echo ""
              echo "updates:"
              git diff --unified=1 .pre-commit-config.yaml |
              grep 'https://[a-zA-Z0-9./?=_%:-]*' | sed -e 's/ \{2,\}//g'
          } >> "$RUNNER_TEMP/commit.txt"

      - name: Commit and push changes
        if: ${{ steps.git-diff.outputs.diff == 'true' }}
        run: |
          git checkout -B ${{ inputs.pr-branch }}
          git add .pre-commit-config.yaml
          git commit --file="${RUNNER_TEMP}/commit.txt"
          git push --force --set-upstream origin ${{ inputs.pr-branch }}

      - name: Create Pull Request
        if: ${{ steps.git-diff.outputs.diff == 'true' }}
        uses: coatl-dev/actions/pr-create@208567f6e604baf94c6e867ec7f345ec9ad36eb4 # v7.0.0
        with:
          gh-token: ${{ secrets.gh-token }}
          auto-merge: ${{ inputs.pr-auto-merge }}
          base-branch: ${{ inputs.autoupdate-branch }}
          delete-branch: ${{ inputs.pr-delete-branch }}
