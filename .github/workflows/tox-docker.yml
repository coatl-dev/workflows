on:
  workflow_call:
    inputs:
      extra-args:
        description: >-
          Extra arguments to pass to tox.
        required: false
        type: string
        default: ''
      working-directory:
        description: >-
          The working directory to run tox in.
        required: false
        type: string
        default: ${{ github.workspace }}
      uv-python:
        description: >-
          The Python version to use with uv.
        required: false
        type: string
        default: '3.14'

jobs:
  tox:
    runs-on: ubuntu-latest
    container:
      image: coatldev/six:latest
    env:
      UV_PYTHON: ${{ inputs.uv-python }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up tox caching
        id: setup-tox
        run: |
          if [[ "${{ inputs.working-directory }}" != "${{ github.workspace }}" ]]; then
            echo "tox-cache-dir=${{ inputs.working-directory }}/.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=${{ inputs.working-directory }}/tox.ini" >> $GITHUB_OUTPUT
          else
            echo "tox-cache-dir=.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=tox.ini" >> $GITHUB_OUTPUT
          fi

      - name: Cache tox
        id: cache-tox
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-tox.outputs.tox-cache-dir }}
          key: tox-${{ env.UV_PYTHON }}-${{ runner.os }}-${{ hashFiles(steps.setup-tox.outputs.tox-ini) }}

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          uvx tox ${{ inputs.extra-args }}
