on:
  workflow_call:
    inputs:
      extra-args:
        description: >-
          Extra arguments to pass to tox.
        required: false
        type: string
        default: ''
      working-directory:
        description: >-
          The working directory to run tox in.
        required: false
        type: string
        default: ${{ github.workspace }}

jobs:
  tox:
    runs-on: ubuntu-latest
    container: coatldev/six:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Checkout requirements repo
        uses: actions/checkout@v5
        with:
          repository: coatl-dev/workflow-requirements
          path: deps

      - name: Install requirements
        run: |
          python -m pip install --requirement deps/requirements/tox.txt

      - name: Set PY
        id: set-py
        run: |
          echo "py=$(python --version | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Set up tox caching
        id: setup-tox
        run: |
          if [[ "${{ inputs.working-directory }}" != "${{ github.workspace }}" ]]; then
            echo "tox-cache-dir=${{ inputs.working-directory }}/.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=${{ inputs.working-directory }}/tox.ini" >> $GITHUB_OUTPUT
          else
            echo "tox-cache-dir=.tox" >> $GITHUB_OUTPUT
            echo "tox-ini=tox.ini" >> $GITHUB_OUTPUT
          fi

      - name: Cache tox
        id: cache-tox
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-tox.outputs.tox-cache-dir }}
          key: tox-${{ steps.set-py.outputs.py }}-${{ runner.os }}-${{ hashFiles(steps.setup-tox.outputs.tox-ini) }}

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          tox ${{ inputs.extra-args }}
