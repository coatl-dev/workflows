on:
  workflow_call:
    inputs:
      checkout-ref:
        description: >-
          The branch, tag or SHA to checkout.
        required: false
        type: string
      path:
        description: >-
          This can be a module, package, directory or a file.
        required: false
        type: string
        default: ''
      extra-args:
        description: >-
          Extra arguments to pass to pylint.
        required: false
        type: string
        default: ''
      working-directory:
        description: >-
          The directory to run the workflow in.
        required: false
        type: string
        default: ${{ github.workspace }}

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: setup-python
        with:
          python-version: '3.14'

      - name: Checkout requirements repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: coatl-dev/workflow-requirements
          path: deps
          persist-credentials: false

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}-${{ hashFiles('deps/requirements/pylint.txt') }}

      - name: Install requirements
        run: |
          python -m pip install --requirement deps/requirements/pylint.txt

      - name: Analysing the code with pylint
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -z "${INPUTS_PATH}" ]; then
            pylint ${INPUTS_EXTRA_ARGS} $(git ls-files '*.py')
          else
            pylint ${INPUTS_EXTRA_ARGS} ${INPUTS_PATH}
          fi
        env:
          INPUTS_PATH: ${{ inputs.path }}
          INPUTS_EXTRA_ARGS: ${{ inputs.extra-args }}
