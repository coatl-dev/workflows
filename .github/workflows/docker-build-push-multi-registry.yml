on:
  workflow_call:
    inputs:
      dockerhub-repo:
        description: >-
          Docker Hub repository to push the image to.
        required: true
        type: string
      dockerhub-username:
        description: >-
          Username for authenticating to Docker Hub.
        required: true
        type: string
      quay-repo:
        description: >-
          Quay repository to push the image to.
        required: true
        type: string
      quay-username:
        description: >-
          Username for authenticating to Quay.
        required: true
        type: string
      build-context:
        description: >-
          Build's context is the set of files located in the specified PATH or URL.
        type: string
        required: false
      build-file:
        description: >-
          Path to the Dockerfile.
        type: string
        required: false
      build-cache-key:
        description: >-
          An explicit key for a cache entry.
        required: false
        type: string
        default: coatl
      build-digest-key:
        description: >-
          Name of the build digest.
        required: false
        type: string
        default: coatl
      metadata-tags:
        description: >-
          List of tags as key-value pair attributes.
        required: false
        type: string
      latest-tag-flavor:
        description: >-
          Set the latest tag flavor.
        required: false
        type: string
        default: auto
    secrets:
      dockerhub-password:
        description: >-
          Password or personal access token for authenticating against Docker Hub.
        required: true
      quay-password:
        description: >-
          Password or personal access token for authenticating against Quay.
        required: true

jobs:
  build:
    runs-on: ${{ matrix.builder.runner-image }}
    strategy:
      fail-fast: false
      matrix:
        builder:
          - runner-image: ubuntu-24.04
            platform: linux/amd64
          - runner-image: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.builder.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: |
            ${{ inputs.dockerhub-repo }}
            ${{ inputs.quay-repo }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.dockerhub-password }}

      - name: Login to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ inputs.quay-username }}
          password: ${{ secrets.quay-password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha,scope=${{ inputs.build-cache-key }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ inputs.build-cache-key }}-${{ env.PLATFORM_PAIR }},mode=max
          context: ${{ inputs.build-context }}
          file: ${{ inputs.build-file }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ inputs.dockerhub-repo }},${{ inputs.quay-repo }}",push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.builder.platform }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${STEPS_BUILD_OUTPUTS_DIGEST}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
        env:
          STEPS_BUILD_OUTPUTS_DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ inputs.build-digest-key }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.build-digest-key }}-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.dockerhub-password }}

      - name: Login to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
            registry: quay.io
            username: ${{ inputs.quay-username }}
            password: ${{ secrets.quay-password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: |
            ${{ inputs.dockerhub-repo }}
            ${{ inputs.quay-repo }}
          tags: |
            ${{ inputs.metadata-tags }}
          flavor: |
            latest=${{ inputs.latest-tag-flavor }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: | # zizmor: ignore[template-injection]
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ inputs.dockerhub-repo }}@sha256:%s ' *)
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ inputs.quay-repo }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${INPUTS_DOCKERHUB_REPO}:${STEPS_META_OUTPUTS_VERSION}
          docker buildx imagetools inspect ${INPUTS_QUAY_REPO}:${STEPS_META_OUTPUTS_VERSION}
        env:
          INPUTS_DOCKERHUB_REPO: ${{ inputs.dockerhub-repo }}
          STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}
          INPUTS_QUAY_REPO: ${{ inputs.quay-repo }}
