on:
  workflow_call:
    inputs:
      checkout-ref:
        description: >-
          The branch, tag or SHA to checkout.
        required: false
        type: string
      skip-hooks:
        required: false
        type: string
        default: ''
      python-version:
        description: >-
          The Python versions to use for the pre-commit hooks. If not specified,
          the default version will be used.
        required: false
        type: string
        default: '3.15'

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Checkout requirements repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coatl-dev/workflow-requirements
          path: deps
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: deps/requirements/prek.txt
          cache-python: true

      - name: Install Python
        id: install-python
        env:
          INPUTS_PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          read -r -d '' -a versions <<< "${INPUTS_PYTHON_VERSION}" || true
          uv python install "${versions[@]}"
          echo "cache-key=$(IFS=-; echo "${versions[*]}")" >> "$GITHUB_OUTPUT"

      - name: Install requirements
        run: |
          uv venv "${RUNNER_TEMP}/prek-venv"
          uv pip install --python "${RUNNER_TEMP}/prek-venv" --requirement deps/requirements/prek.txt
          echo "${RUNNER_TEMP}/prek-venv/bin" >> "$GITHUB_PATH"

      - name: Cache prek
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ steps.install-python.outputs.cache-key }}-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run prek
        env:
          SKIP: ${{ inputs.skip-hooks }}
        run: |
          prek run --all-files --color=always
